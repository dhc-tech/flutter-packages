# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Configures CodeRabbit (https://coderabbit.ai) — free for public repos.
# Has no effect until the CodeRabbit GitHub App is installed on this repo:
# https://github.com/marketplace/coderabbitai — Install → select
# dhc-tech/flutter-packages. Once installed, it reviews every PR
# automatically using this config, alongside Gemini Code Assist and
# PR-Agent — three independent AI reviewers, each catching different
# things.
#
# Docs: https://docs.coderabbit.ai/configure-coderabbit/

language: "en-US"
early_access: false
tone_instructions: "Be concise and objective. State what the code does, not subjective value judgments."

reviews:
  profile: chill
  high_level_summary: true
  auto_apply_labels: false
  suggested_reviewers: false
  changed_files_summary: true
  suggested_labels: false
  abort_on_close: true
  poem: false
  sequence_diagrams: true
  path_instructions:
    - path: '**/*.dart'
      instructions: >-
        Review Dart/Flutter code for null-safety correctness, resource cleanup
        (unclosed StreamControllers/Timers/subscriptions), and proper
        async/await usage. Follow the conventions in
        https://github.com/flutter/packages/blob/main/CONTRIBUTING.md#style.
        Flag any hardcoded secrets, proprietary client names, or bundle
        identifiers — use neutral placeholders instead
        (e.g. com.example.acme).
    - path: '.github/workflows/**'
      instructions: >-
        Check for script-injection risk from untemplated
        ${{ github.event.*.body }}/${{ github.event.*.title }}
        interpolation, missing least-privilege permissions blocks, and
        secrets exposed to pull_request_target triggers.
    - path: 'packages/*/CHANGELOG.md'
      instructions: >-
        Do not flag missing tests/docs for changelog-only entries — these
        are typically generated by the melos release bot, not hand-written.
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"

knowledge_base:
  opt_out: true

chat:
  auto_reply: true
