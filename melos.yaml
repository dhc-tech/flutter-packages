name: flutter_packages_monorepo
repository: https://github.com/dhc-tech/flutter-packages

packages:
  - packages/**

command:
  version:
    linkToCommits: true
    workspaceChangelog: true
    branch: main
    message: |
      chore(release): version packages [skip ci]

      %AUTHORS%

scripts:
  analyze:
    run: |
      melos exec -c 1 -- "if grep -q 'sdk: flutter' pubspec.yaml; then flutter analyze --fatal-infos; else dart analyze --fatal-infos; fi"
    description: Run static analysis with zero warnings/errors across all packages.

  format:
    run: |
      for pkg in packages/*; do
        [ -f "$pkg/pubspec.yaml" ] || continue
        (cd "$pkg" && dart format --output=none --set-exit-if-changed .)
      done
    description: |
      Verify code formatting, one package at a time. Formatting from the
      repo root in one shot (`dart format packages/`) resolves each
      file's language version ambiguously across independently-versioned
      packages with no root workspace pubspec, which made the formatter
      non-convergent (flip-flopping between two valid outputs on
      successive runs). Scoping each invocation to a single package's own
      resolved context is stable.

  format:fix:
    run: |
      for pkg in packages/*; do
        [ -f "$pkg/pubspec.yaml" ] || continue
        (cd "$pkg" && dart format .)
      done
    description: Apply automatic code formatting, one package at a time (see format).

  test:
    run: |
      melos exec -c 1 --fail-fast --dir-exists="test" -- "if grep -q 'sdk: flutter' pubspec.yaml; then flutter test; else dart test; fi"
    description: Run unit/widget tests in packages containing a test folder.

  pana:
    run: |
      melos exec -c 1 -- "pana --no-warning ."
    description: Verify Pub.dev quality health score on each package.
