# Path-based PR labels (actions/labeler, run by pr-labels.yml). One `p:` label
# per package family, `platform:` labels for platform implementation packages.
# The `type:` and `breaking-change` labels come from the PR title in
# pr-labels.yml; `infra: dependencies` is set by Dependabot.

'p: apple_sign_in_plugin':
  - changed-files:
    - any-glob-to-any-file:
      - 'packages/apple_sign_in_plugin/**'

'p: attachment_engine':
  - changed-files:
    - any-glob-to-any-file:
      - 'packages/attachment_engine/**'

'p: dig_cli':
  - changed-files:
    - any-glob-to-any-file:
      - 'packages/dig_cli/**'

'p: white_label_kit':
  - changed-files:
    - any-glob-to-any-file:
      - 'packages/white_label_kit/**'

'platform: android':
  - changed-files:
    - any-glob-to-any-file:
      - 'packages/*/*_android/**'

'platform: ios':
  - changed-files:
    - any-glob-to-any-file:
      - 'packages/*/*_ios/**'

'platform: macos':
  - changed-files:
    - any-glob-to-any-file:
      - 'packages/*/*_macos/**'

'platform: linux':
  - changed-files:
    - any-glob-to-any-file:
      - 'packages/*/*_linux/**'

'platform: windows':
  - changed-files:
    - any-glob-to-any-file:
      - 'packages/*/*_windows/**'

'platform: web':
  - changed-files:
    - any-glob-to-any-file:
      - 'packages/*/*_web/**'

'platform: darwin':
  - changed-files:
    - any-glob-to-any-file:
      - 'packages/*/*_darwin/**'

'platform: interface':
  - changed-files:
    - any-glob-to-any-file:
      - 'packages/*/*_platform_interface/**'

'infra: workflows':
  - changed-files:
    - any-glob-to-any-file:
      - '.github/**'

'documentation':
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.md'
      - '**/doc/**'
      - 'docs/**'
