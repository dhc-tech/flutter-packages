#
# Official actions/stale: marks inactive issues/PRs, closes only if still
# inactive after the additional grace period. Any comment or push resets
# the clock. Deliberately conservative windows so active work is never
# swept up.

name: Stale

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9.1.0
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          stale-issue-message: >
            This issue has had no activity for 60 days and will be closed in
            14 days if it stays inactive. Comment or push a commit to keep it
            open.
          stale-pr-message: >
            This PR has had no activity for 60 days and will be closed in 14
            days if it stays inactive. Comment or push a commit to keep it
            open.
          close-issue-message: 'Closed due to inactivity. Reopen if this is still relevant.'
          close-pr-message: 'Closed due to inactivity. Reopen if you want to continue this work.'
          exempt-issue-labels: 'do-not-close,pinned'
          exempt-pr-labels: 'do-not-close,pinned'
          exempt-draft-pr: false
