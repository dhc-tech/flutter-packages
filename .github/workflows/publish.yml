# Publish to Pub.dev
#
# Triggers on:
#   • A git tag like `apple_sign_in_plugin-v1.3.0` pushed to main
#   • Manual workflow_dispatch for one-off or dry-run publishes
#
# One tag == one package == one isolated run. When a batch release
# creates multiple tags at once, each gets its own separate workflow
# run — a failure in one package's publish has no effect on any other
# package's run, by construction (not something this file has to
# orchestrate itself).
#
# Authentication:
#   Pub.dev OIDC (no token storage needed!) — official dart-lang pattern.
#   The repo must be configured at https://pub.dev/publishers with the
#   GitHub Actions OIDC provider. See: https://dart.dev/tools/pub/automated-publishing

name: 🚀 Publish to Pub.dev

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    # A single pattern (<any-name>-v<version>) instead of one entry per
    # package name — adding a new package to packages/** needs zero
    # changes here. The actual package name is parsed from the matched
    # tag at runtime (see "Determine Target Package" below), not from
    # this list.
    tags:
      # GitHub's tag filters use simple glob syntax, not regex — no
      # quantifiers like [0-9]+. This matches any tag ending in
      # "-v<digit>...". Package-name validity and the exact version
      # format are checked at runtime below, not by this pattern.
      - '*-v[0-9]*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory name under packages/ to publish'
        required: true
        type: string
      dry_run:
        description: 'Dry-run only (no actual publish)'
        required: true
        type: boolean
        default: true

permissions: {}

jobs:
  publish:
    name: 🚀 Publish Package to Pub.dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write   # Required for OIDC pub.dev authentication
      contents: write   # Required for softprops/action-gh-release to create the release

    steps:
      - name: 📥 Checkout Monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Use flutter-action so formatter & analyzer match CI exactly
      - name: 🛠️ Setup Dart & Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          cache: true

      # ── Determine which package + version to publish ──────────────────────
      - name: 🎯 Determine Target Package & Version
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pkg="$INPUT_PACKAGE"
            if [ ! -f "packages/$pkg/pubspec.yaml" ]; then
              echo "❌ No packages/$pkg/pubspec.yaml — not a real package directory." && exit 1
            fi
            echo "package=$pkg" >> "$GITHUB_OUTPUT"
            echo "dry_run=$INPUT_DRY_RUN" >> "$GITHUB_OUTPUT"
            echo "tag_version=" >> "$GITHUB_OUTPUT"
          else
            # Tag format: <package>-v<version>. The package name is
            # whatever's left after stripping the trailing -v<version>,
            # matched against real directories under packages/ — no
            # hardcoded package-name list to keep in sync.
            tag="$REF_NAME"
            tag_version="${tag##*-v}"
            pkg="${tag%-v"$tag_version"}"
            if [ ! -f "packages/$pkg/pubspec.yaml" ]; then
              echo "❌ Tag '$tag' doesn't resolve to a real package directory (packages/$pkg not found)." && exit 1
            fi
            echo "package=$pkg" >> "$GITHUB_OUTPUT"
            echo "tag_version=$tag_version" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Validate before touching anything else ─────────────────────────────
      - name: ✅ Validate package is publishable & version matches tag
        shell: bash
        env:
          TARGET_PACKAGE: ${{ steps.target.outputs.package }}
          TAG_VERSION: ${{ steps.target.outputs.tag_version }}
        run: |
          pkg="packages/$TARGET_PACKAGE"
          pubspec_version=$(grep '^version:' "$pkg/pubspec.yaml" | head -1 | awk '{print $2}' | tr -d "'\"")

          if grep -q '^publish_to: *none' "$pkg/pubspec.yaml"; then
            echo "❌ $TARGET_PACKAGE has publish_to: none — this package must never be published. Stopping." && exit 1
          fi

          if [ -n "$TAG_VERSION" ] && [ "$TAG_VERSION" != "$pubspec_version" ]; then
            echo "❌ Tag version ($TAG_VERSION) doesn't match packages/$TARGET_PACKAGE/pubspec.yaml's version ($pubspec_version). Stopping — publishing the wrong version is worse than not publishing." && exit 1
          fi

          if ! grep -q "$pubspec_version" "$pkg/CHANGELOG.md" 2>/dev/null; then
            echo "❌ CHANGELOG.md has no entry for version $pubspec_version. Stopping." && exit 1
          fi

          echo "version=$pubspec_version" >> "$GITHUB_OUTPUT"
          echo "✅ $TARGET_PACKAGE@$pubspec_version — publishable, version matches tag, changelog has an entry."
        id: validate

      - name: 🔁 Check if this version is already published
        if: steps.target.outputs.dry_run == 'false'
        shell: bash
        env:
          TARGET_PACKAGE: ${{ steps.target.outputs.package }}
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          # pub.dev versions are immutable, so dart pub publish would
          # itself reject a re-publish — but checking first means a
          # workflow rerun (e.g. after a later step failed) reports
          # "already published, nothing to do" instead of a scary-
          # looking but harmless failure.
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://pub.dev/api/packages/${TARGET_PACKAGE}/versions/${VERSION}")
          if [ "$status" = "200" ]; then
            echo "ℹ️ $TARGET_PACKAGE@$VERSION is already published on pub.dev. Nothing to do."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi
        id: check_published

      # ── Quality gate before publishing ───────────────────────────────────
      - name: 📦 Install Package Dependencies
        if: steps.check_published.outputs.already_published != 'true'
        shell: bash
        env:
          TARGET_PACKAGE: ${{ steps.target.outputs.package }}
        run: |
          pkg="packages/$TARGET_PACKAGE"
          if grep -q "sdk: flutter" "$pkg/pubspec.yaml"; then
            (cd "$pkg" && flutter pub get)
          else
            (cd "$pkg" && dart pub get)
          fi

      - name: 🔍 Static Analysis
        if: steps.check_published.outputs.already_published != 'true'
        shell: bash
        env:
          TARGET_PACKAGE: ${{ steps.target.outputs.package }}
        run: |
          pkg="packages/$TARGET_PACKAGE"
          if grep -q "sdk: flutter" "$pkg/pubspec.yaml"; then
            (cd "$pkg" && flutter analyze --fatal-infos)
          else
            (cd "$pkg" && dart analyze --fatal-infos)
          fi

      - name: 🧪 Run Tests
        if: steps.check_published.outputs.already_published != 'true'
        shell: bash
        env:
          TARGET_PACKAGE: ${{ steps.target.outputs.package }}
        run: |
          pkg="packages/$TARGET_PACKAGE"
          if [ -d "$pkg/test" ]; then
            if grep -q "sdk: flutter" "$pkg/pubspec.yaml"; then
              (cd "$pkg" && flutter test)
            else
              (cd "$pkg" && dart test)
            fi
          fi

      # ── Strip workspace-only metadata before publishing ────────────────────
      # `resolution: workspace` in each package's pubspec.yaml is required
      # for melos 8+/native pub workspaces to discover packages in this
      # monorepo — but dart pub publish packages the file verbatim. If
      # that line reached pub.dev, `dart pub get` would break for every
      # consumer outside this repo (their pub tool looks for a workspace
      # root that doesn't exist for them). This is a plain, uncommitted
      # local edit made right before publish — never pushed anywhere.
      - name: 🧹 Strip resolution:workspace before publish
        if: steps.check_published.outputs.already_published != 'true'
        shell: bash
        env:
          TARGET_PACKAGE: ${{ steps.target.outputs.package }}
        run: |
          pkg="packages/$TARGET_PACKAGE"
          sed -i '/^resolution: workspace$/d' "$pkg/pubspec.yaml"
          grep -q "resolution: workspace" "$pkg/pubspec.yaml" && {
            echo "❌ Failed to strip resolution: workspace — aborting publish."
            exit 1
          }
          echo "✅ Confirmed resolution: workspace is not present in the package to be published."

      - name: 🧪 Dry-run validate (always, even for a real publish)
        if: steps.check_published.outputs.already_published != 'true'
        shell: bash
        env:
          TARGET_PACKAGE: ${{ steps.target.outputs.package }}
        run: |
          pkg="packages/$TARGET_PACKAGE"
          # `dart pub publish --dry-run` exits 65 for warnings-only (not
          # a real problem) vs. any other nonzero exit for a genuine
          # validation error. Exit 65 is actually *expected* here every
          # single time: the previous step intentionally leaves
          # pubspec.yaml modified relative to git (stripping
          # resolution: workspace), which pub always flags as "checked-
          # in files are modified in git" — a real error would need
          # letting through, but that specific, permanent, by-design
          # warning must never fail this job.
          set +e
          output=$(cd "$pkg" && dart pub publish --dry-run 2>&1)
          exit_code=$?
          set -e
          echo "$output"
          if [ $exit_code -eq 0 ]; then
            echo "✅ Dry-run clean, no warnings."
          elif [ $exit_code -eq 65 ]; then
            echo "⚠️ Dry-run has warnings only (expected — see comment above) — continuing."
          else
            echo "❌ Dry-run failed with a real error (exit $exit_code) — aborting publish."
            exit 1
          fi

      # ── Publish (OIDC — no stored token needed) ───────────────────────────
      - name: 🚀 Publish to Pub.dev (OIDC)
        if: steps.check_published.outputs.already_published != 'true' && steps.target.outputs.dry_run == 'false'
        shell: bash
        env:
          TARGET_PACKAGE: ${{ steps.target.outputs.package }}
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          echo "Publishing $TARGET_PACKAGE@$VERSION"
          (cd "packages/$TARGET_PACKAGE" && dart pub publish --force)

      # ── Create GitHub Release on successful publish ───────────────────────
      - name: 🏷️ Create GitHub Release
        if: steps.check_published.outputs.already_published != 'true' && steps.target.outputs.dry_run == 'false' && github.event_name == 'push'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          name: "${{ steps.target.outputs.package }} ${{ github.ref_name }}"
