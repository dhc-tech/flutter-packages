name: 🤖 Qodo Merge (PR-Agent)

on:
  # pull_request runs the automatic first-pass review on every PR open
  # (or push) — this was previously missing entirely, so PR-Agent only
  # ever ran if someone manually commented a trigger phrase. issue_comment
  # is kept for on-demand re-review commands (e.g. "/improve", "/ask").
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent:
    name: 🧠 PR-Agent Review
    if: >-
      github.event.sender.type != 'Bot' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]' &&
      (github.event.pull_request.draft != true)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write       # PR-Agent can push suggested-fix commits
      pull-requests: write  # posting/updating review comments on the PR
      issues: write         # PR-Agent's underlying API treats PRs as issues for comments
      checks: write         # publishing its review as a check run

    steps:
      - name: 🤖 Run PR-Agent
        uses: the-pr-agent/pr-agent@f6af7d77554ff8d26adffded077e6461329e92fa # v0.42.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          config.model: "gemini/gemini-2.0-flash"
          config.fallback_models: '["gemini/gemini-2.0-flash"]'
          config.git_provider: "github"
          pr_reviewer.num_code_suggestions: "4"
          pr_reviewer.inline_code_comments: "true"