name: 🤖 AI PR Reviewer (Gemini)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai_review:
    name: 🧠 Gemini Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: 🔑 Check API Key Availability
        id: check_key
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "⚠️ GEMINI_API_KEY secret not configured."
            echo "ℹ️ To enable free AI reviews:"
            echo "   1. Get a FREE key at: https://aistudio.google.com/app/apikey"
            echo "   2. Add it as a GitHub Secret: Settings → Secrets → Actions → New secret"
            echo "   3. Name it: GEMINI_API_KEY"
          fi

      - name: 🚀 Run Gemini AI Review
        if: steps.check_key.outputs.available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 .github/scripts/ai_pr_reviewer.py

      - name: 💬 Post Setup Instructions (API Key Missing)
        if: steps.check_key.outputs.available == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request

          token = os.environ.get('GITHUB_TOKEN', '')
          repo = os.environ.get('REPO', '')
          pr_number = os.environ.get('PR_NUMBER', '')

          # Only post the setup guide once — check if we already posted
          list_url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments?per_page=20"
          req = urllib.request.Request(
              list_url,
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'Flutter-AI-Reviewer',
              }
          )
          try:
              with urllib.request.urlopen(req) as res:
                  comments = json.loads(res.read().decode('utf-8'))
                  for c in comments:
                      if 'GEMINI_API_KEY' in c.get('body', ''):
                          print("Setup guide already posted. Skipping.")
                          exit(0)
          except Exception:
              pass  # best-effort

          body = (
              "## 🤖 AI PR Reviewer — Setup Required\n\n"
              "> **GEMINI_API_KEY** is not configured. AI code review is currently disabled for this repository.\n\n"
              "### ✅ Enable Free AI Reviews in 2 minutes:\n\n"
              "1. **Get your FREE Gemini API key** → [aistudio.google.com/app/apikey](https://aistudio.google.com/app/apikey) _(100% free tier, no credit card)_\n"
              "2. **Add as a GitHub Secret** → [Settings → Secrets → Actions](https://github.com/{repo}/settings/secrets/actions)\n"
              "3. **Name it exactly:** `GEMINI_API_KEY`\n\n"
              "Once added, every PR will receive an automated Gemini 2.0 Flash review covering:\n"
              "- 🛡️ Security & secrets exposure\n"
              "- 💎 Dart/Flutter standards compliance\n"
              "- ⚠️ Breaking change detection\n"
              "- 🧪 Test coverage audit\n\n"
              "---\n"
              "*This message appears once until the secret is configured.*"
          ).format(repo=repo)

          comment_url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
          comment_req = urllib.request.Request(
              comment_url,
              data=json.dumps({'body': body}).encode('utf-8'),
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'Flutter-AI-Reviewer',
              }
          )
          try:
              with urllib.request.urlopen(comment_req):
                  print("Posted AI reviewer setup guide to PR.")
          except Exception as e:
              print(f"Could not post setup guide: {e}")
          EOF
