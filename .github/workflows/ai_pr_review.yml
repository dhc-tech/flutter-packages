# 100% Free AI-Powered Pull Request Reviewer using Google Gemini 2.0 Flash Free Tier.
# Automatically reviews PR diffs across 'packages/' for Flutter/Dart standards, breaking changes, and zero-bug rules.
# Gracefully skips if GEMINI_API_KEY secret is not present.

name: 🤖 Free AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'packages/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  ai_review:
    name: 🧠 Gemini Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Check Gemini API Key
        id: check_key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "has_key=false" >> $GITHUB_OUTPUT
            echo "ℹ️ GEMINI_API_KEY secret is not configured. Skipping AI review."
          else
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Run AI Review
        if: steps.check_key.outputs.has_key == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 1. Get git diff for packages only
          DIFF=$(git diff $BASE_SHA..$HEAD_SHA -- 'packages/*' | head -c 30000)

          if [ -z "$DIFF" ]; then
            echo "No package diff to analyze."
            exit 0
          fi

          # 2. Prepare AI prompt
          cat << 'EOF' > prompt.json
          {
            "contents": [
              {
                "parts": [
                  {
                    "text": "You are a senior Flutter/Dart architect performing an automated PR review for the official flutter-packages monorepo (white_label_kit, dig_cli, apple_sign_in_plugin).\n\nReview the following Git Diff and provide a concise, high-value review:\n1. 🛡️ Security & Privacy: Ensure NO hardcoded credentials, secret keys, or proprietary brand names/bundle IDs.\n2. 💎 Dart/Flutter Standards: Effective Dart, type safety, error handling, null safety.\n3. ⚠️ Breaking Changes: Any public API modifications or migration notices needed.\n4. 📚 Documentation: README & doc comments sync.\n\nKeep the response concise and format in GitHub Markdown with clear recommendations.\n\nDiff:\n"
                  },
                  {
                    "text": ""
                  }
                ]
              }
            ],
            "generationConfig": {
              "temperature": 0.2,
              "maxOutputTokens": 1024
            }
          }
          EOF

          # Escape diff into JSON
          python3 -c "
          import json, os
          diff = '''$DIFF'''
          with open('prompt.json', 'r') as f:
              data = json.load(f)
          data['contents'][0]['parts'][1]['text'] = diff
          with open('payload.json', 'w') as f:
              json.dump(data, f)
          "

          # 3. Call Gemini 2.0 Flash (Free Tier)
          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d @payload.json)

          REVIEW_TEXT=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          try:
              data = json.load(sys.stdin)
              print(data['candidates'][0]['content']['parts'][0]['text'])
          except Exception as e:
              print('AI Review analysis could not be parsed: ' + str(e))
          ")

          # 4. Post comment to GitHub PR
          COMMENT_BODY=$(cat << EOF
          ## 🤖 Free AI PR Review (Gemini 2.0 Flash)

          $REVIEW_TEXT

          ---
          *Automated review powered by Google Gemini Free Tier.*
          EOF
          )

          python3 -c "
          import os, json, urllib.request
          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['REPO']
          pr_number = os.environ['PR_NUMBER']
          body = '''$COMMENT_BODY'''

          url = f'https://api.github.com/repos/{repo}/issues/{pr_number}/comments'
          req = urllib.request.Request(
              url,
              data=json.dumps({'body': body}).encode('utf-8'),
              headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'Flutter-Packages-AI-Reviewer'
              }
          )
          try:
              urllib.request.urlopen(req)
              print('Successfully posted AI review comment.')
          except Exception as e:
              print('Failed to post comment:', e)
          "
