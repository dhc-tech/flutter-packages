#
# Official GitHub Dependency Review Action: flags newly-introduced
# vulnerable dependencies in a PR's diff. Maintained by GitHub
# (actions/dependency-review-action).

name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.0.0
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@67d4f4bd7a9b17a0db54d2a7519187c65e339de8 # v4.7.3
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
