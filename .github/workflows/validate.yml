name: Validate Repository

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

# Declare default permissions as read only.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: $/.github/actions/install_flutter

      - name: Cache pub packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Resolve workspace dependencies
        run: .github/scripts/ci.sh pub-get

      - name: Check formatting
        if: ${{ !cancelled() }}
        run: .github/scripts/ci.sh format

      - name: Run static analysis
        if: ${{ !cancelled() }}
        run: .github/scripts/ci.sh analyze

      - name: Test CI scripts
        if: ${{ !cancelled() }}
        run: .github/scripts/ci.sh scripts

      - name: Test workflow scripts
        if: ${{ !cancelled() }}
        run: .github/scripts/ci.sh workflows

      - name: Run tests
        if: ${{ !cancelled() }}
        run: .github/scripts/ci.sh tests

      - name: Verify packages are publishable
        if: ${{ !cancelled() }}
        run: .github/scripts/ci.sh publish-check
