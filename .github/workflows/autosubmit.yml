name: Autosubmit

# Maintainers add the `autosubmit` label to a pull request to turn on GitHub's
# native auto-merge (squash). GitHub then merges only once every required
# check passes and the required approval is in, exactly as a manual merge
# would. Removing the label turns auto-merge off again.
#
# Merges made with the default GITHUB_TOKEN do not trigger the `push` event, so
# for hands-free publishing add an AUTOMERGE_PAT secret (a token with
# `pull-requests: write` and `contents: write`); otherwise run the `release`
# workflow manually after the merge. See docs/release_architecture.md.

on:
  # zizmor: ignore[dangerous-triggers] Safe: no checkout and no PR code is executed. The job verifies the actor has write access before touching auto-merge.
  pull_request_target:
    types: [labeled, unlabeled]

permissions: read-all

jobs:
  autosubmit:
    name: autosubmit
    if: github.event.label.name == 'autosubmit'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Toggle auto-merge
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.AUTOMERGE_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username: context.actor,
            });
            if (!['admin', 'maintain', 'write'].includes(access.permission)) {
              core.warning(`${context.actor} cannot use autosubmit; removing the label.`);
              await github.rest.issues.removeLabel({
                owner, repo, issue_number: pr.number, name: 'autosubmit',
              });
              return;
            }

            if (context.payload.action === 'labeled') {
              await github.graphql(
                `mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                    clientMutationId
                  }
                }`,
                { id: pr.node_id },
              );
              core.info(`Auto-merge enabled for #${pr.number}.`);
            } else {
              await github.graphql(
                `mutation($id: ID!) {
                  disablePullRequestAutoMerge(input: { pullRequestId: $id }) {
                    clientMutationId
                  }
                }`,
                { id: pr.node_id },
              );
              core.info(`Auto-merge disabled for #${pr.number}.`);
            }
