#
# Single consolidated Issue classification and triage engine, matching
# pr-metadata.yml. Built on the official actions/github-script action to
# avoid fragile marketplace action dependencies.

name: Issue Metadata & Triage

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-triage-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  triage:
    name: triage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Classify, label, and assign issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue;
            if (!issue) return;

            const title = issue.title || '';
            const body = issue.body || '';
            const text = `${title}\n${body}`;

            // Fetch live issue data to avoid stale payload labels on rapid consecutive edits
            const { data: liveIssue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
            });

            const existingLabels = (liveIssue.labels || []).map((l) => typeof l === 'string' ? l : l.name);
            const nextLabels = new Set(existingLabels);

            // ---- Package classification (p:*) ----
            const PACKAGE_RULES = [
              { label: 'p: white_label_kit', regex: /white[_ -]?label/i },
              { label: 'p: dig_cli', regex: /dig[_ -]?cli/i },
              { label: 'p: apple_sign_in_plugin', regex: /apple[_ -]?sign[_ -]?in/i },
            ];
            for (const { label, regex } of PACKAGE_RULES) {
              if (regex.test(text)) nextLabels.add(label);
            }

            // ---- Type classification (type:*) ----
            if (/\[Bug\]/i.test(title) || /\b(bug|crash|error|exception|broken|doesn't work|not working)\b/i.test(text)) {
              nextLabels.add('type:fix');
            }
            if (/\[Feature\]/i.test(title) || /\b(feature request|feature|enhancement|proposal)\b/i.test(text)) {
              nextLabels.add('type:feat');
            }
            if (/\b(docs?|documentation|readme)\b/i.test(text)) {
              nextLabels.add('documentation');
            }
            if (/\b(ci|github actions?|workflows?|pipelines?)\b/i.test(text)) {
              nextLabels.add('infra: workflows');
            }
            if (/\bbreaking[_ -]?change\b/i.test(text)) {
              nextLabels.add('breaking-change');
            }

            // ---- Apply labels ----
            const finalLabels = [...nextLabels].sort();
            if (JSON.stringify(finalLabels) !== JSON.stringify([...existingLabels].sort())) {
              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: finalLabels,
              });
              core.info(`Updated labels for #${issue.number}: ${finalLabels.join(', ')}`);
            }

            // ---- Auto-assign maintainer on open ----
            if (context.payload.action === 'opened') {
              const currentAssignees = (issue.assignees || []).map((a) => a.login);
              if (!currentAssignees.includes('dhc-tech')) {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  assignees: ['dhc-tech'],
                });
                core.info(`Assigned dhc-tech to #${issue.number}`);
              }
            }

            // ---- Smart AI Triage / Auto-comment on open ----
            if (context.payload.action === 'opened') {
              const packageNames = PACKAGE_RULES.filter((r) => r.regex.test(text)).map((r) => r.label);
              const targetPkg = packageNames.length > 0 ? packageNames.join(', ') : 'general repository';

              let commentBody = '';
              const groqKey = process.env.GROQ_API_KEY;

              if (groqKey && groqKey.trim().length > 0) {
                try {
                  const aiRes = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                      'Authorization': `Bearer ${groqKey.trim()}`,
                      'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                      model: 'llama-3.3-70b-versatile',
                      messages: [
                        {
                          role: 'system',
                          content: 'You are the official AI Technical Assistant for DHC Tech Flutter Packages monorepo (packages: white_label_kit, dig_cli, apple_sign_in_plugin). Provide a helpful, technical, concise initial triage comment on this newly opened issue. Give troubleshooting advice, check if reproduction details or Flutter doctor output are needed, and provide relevant tips. Format in clean markdown.',
                        },
                        {
                          role: 'user',
                          content: `Issue Title: ${title}\nTarget Package: ${targetPkg}\nIssue Content:\n${body}`,
                        },
                      ],
                      temperature: 0.3,
                      max_tokens: 800,
                    }),
                  });

                  if (aiRes.ok) {
                    const aiData = await aiRes.json();
                    const aiContent = aiData.choices?.[0]?.message?.content;
                    if (aiContent && aiContent.trim().length > 0) {
                      commentBody = `### 👋 Thank you for reporting!

We have categorized this issue for **${targetPkg}** and assigned maintainer @dhc-tech.

---
### 🤖 AI Triage & Guidance:
${aiContent.trim()}

---
_Auto-triage powered by Groq Llama 3.3. Maintainer @dhc-tech will follow up soon!_`;
                    }
                  } else {
                    core.warning(`Groq API responded with status: ${aiRes.status}`);
                  }
                } catch (err) {
                  core.warning(`Groq AI triage call failed: ${err.message}`);
                }
              }

              // Fallback to standard template if AI was not available
              if (!commentBody) {
                commentBody = `### 👋 Thank you for reporting!

We have automatically categorized this issue for **${targetPkg}** and assigned maintainer @dhc-tech for review.

---
#### 📋 Next Steps & Tips:
- If this is a **bug**, please make sure you provided the exact package version, Flutter \`flutter doctor -v\` output, and a minimal reproducible snippet.
- If this is a **feature request**, please provide any relevant API design thoughts or specific use cases.
- We will review this and follow up shortly!`;
              }

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: commentBody,
              });
              core.info(`Posted automated welcome & triage comment on #${issue.number}`);
            }
