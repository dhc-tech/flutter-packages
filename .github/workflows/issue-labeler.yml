name: Issue Labeler

# Adds package, platform and type labels to issues from their title and body.
# Labels are only ever added, never removed, so a triager's choices stick.
# See docs/labels.md for the label conventions.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-labeler-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  label:
    name: label
    runs-on: ubuntu-latest
    steps:
      - name: Add labels from issue text
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const { issue } = context.payload;
            const text = `${issue.title}\n${issue.body ?? ''}`;

            const RULES = [
              ['p: apple_sign_in_plugin', /apple[_ -]?sign[_ -]?in/i],
              ['p: attachment_engine', /attachment[_ -]?engine/i],
              ['p: dig_cli', /dig[_ -]?cli/i],
              ['p: white_label_kit', /white[_ -]?label/i],
              ['platform: android', /\bandroid\b/i],
              ['platform: ios', /\bios\b/i],
              ['platform: macos', /\bmac ?os\b/i],
              ['platform: linux', /\blinux\b/i],
              ['platform: windows', /\bwindows\b/i],
              ['platform: web', /\b(web|browser|chrome|safari)\b/i],
              ['type: fix', /\[bug\]|\b(bug|crash|exception|broken|not working)\b/i],
              ['type: feat', /\[feature\]|\b(feature request|enhancement|proposal)\b/i],
              ['documentation', /\b(docs?|documentation|readme)\b/i],
              ['infra: workflows', /\b(github actions?|workflows?|pipelines?)\b/i],
              ['breaking-change', /\bbreaking[_ -]?change\b/i],
            ];

            const existing = issue.labels.map((l) => l.name);
            const toAdd = RULES
              .filter(([label, regex]) => regex.test(text) && !existing.includes(label))
              .map(([label]) => label);

            if (toAdd.length === 0) return;
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: toAdd,
            });
            core.info(`Added to #${issue.number}: ${toAdd.join(', ')}`);
