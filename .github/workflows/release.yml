name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base-sha:
        description: >-
          Base SHA/ref to diff package versions against (defaults to the
          previous commit). Use it to publish version bumps that were merged
          while this workflow was broken.
        required: false
        type: string

# Declare default permissions as read only.
permissions: read-all

# Releases run one at a time so merges never publish concurrently.
concurrency:
  group: release-publishing-lock
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      # Pushes package tags and reads the validate check.
      contents: write
      checks: read
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Full history and tags are needed to diff versions.
          persist-credentials: false

      - name: Install Flutter
        uses: $/.github/workflows/internals/install_flutter

      - name: Wait for validate check
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const targetSha = context.sha;
            core.info(`Waiting for validate check on ${targetSha}...`);
            for (let i = 0; i < 40; i++) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: targetSha,
                check_name: 'validate',
              });
              const check = data.check_runs.find((c) => c.name === 'validate');
              if (check && check.status === 'completed') {
                if (check.conclusion === 'success') return;
                core.setFailed(`validate finished with conclusion: ${check.conclusion}`);
                return;
              }
              await new Promise((r) => setTimeout(r, 15000));
            }
            core.setFailed('Timed out waiting for the validate check');

      - name: Publish changed packages
        env:
          BASE_SHA: ${{ inputs.base-sha }}
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_USER_NAME: ${{ secrets.USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.USER_EMAIL }}
        run: |
          gh auth setup-git
          git config --global user.name "$GIT_USER_NAME"
          git config --global user.email "$GIT_USER_EMAIL"
          flutter pub get
          .github/scripts/publish_changed.sh
