name: release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base-sha:
        description: >-
          Base SHA/ref to diff against for --all-changed (defaults to HEAD~).
          Use this to publish version bumps that were merged while this
          workflow was broken and never got picked up automatically.
        required: false
        type: string

# Declare default permissions as read only.
permissions: read-all

# Enforce sequential release execution so multiple merges never publish concurrently
concurrency:
  group: release-publishing-lock
  cancel-in-progress: false

jobs:
  release:
    name: release
    permissions:
      # Release needs to push a tag back to the repo and read validate checks.
      contents: write
      checks: read
    runs-on: ubuntu-latest
    steps:
    # Checks out a copy of the repo.
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0 # Fetch all history so the tool can get all the tags to determine version.
        persist-credentials: false
    - name: "Install Flutter"
      uses: ./.github/workflows/internals/install_flutter
    - name: Set up tools
      run: dart pub get
      working-directory: ${{ github.workspace }}/script/tool

    # Wait for this SHA's 'validate' check to finish successfully before publishing
    - name: Wait for validate check
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      with:
        script: |
          const targetSha = '${{ github.sha }}';
          core.info(`Waiting for validate check to complete on ${targetSha}...`);

          for (let i = 0; i < 30; i++) {
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: targetSha,
              check_name: 'validate',
            });
            const validateCheck = data.check_runs.find((c) => c.name === 'validate');
            if (validateCheck && validateCheck.status === 'completed') {
              if (validateCheck.conclusion === 'success') {
                core.info('Validate check passed successfully!');
                return;
              } else {
                core.setFailed(`Validate check finished with conclusion: ${validateCheck.conclusion}`);
                return;
              }
            }
            core.info(`Validate check status: ${validateCheck ? validateCheck.status : 'pending/queued'}, waiting 15s...`);
            await new Promise((r) => setTimeout(r, 15000));
          }
          core.setFailed('Timed out waiting for validate check to complete');

    - name: run release
      run: |
        gh auth setup-git
        git config --global user.name ${{ secrets.USER_NAME }}
        git config --global user.email ${{ secrets.USER_EMAIL }}
        dart ./script/tool/lib/src/main.dart publish --all-changed --base-sha="${BASE_SHA:-HEAD~}" --skip-confirmation --remote=origin
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        PUB_CREDENTIALS: "${{ secrets.PUB_CREDENTIALS }}"
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
