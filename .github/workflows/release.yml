name: release

# Publishes every package whose current `version:` is not on pub.dev yet and
# tags it <package>-v<version>. It runs on every push to `main`, every 10
# minutes, and on demand. Merges made with the default GITHUB_TOKEN (auto-merge
# via `status: automerge`) do not trigger `push` workflows, so the schedule is
# what releases them, and a failed run is simply completed by the next one. A
# run with nothing to publish only checks pub.dev and exits in seconds.

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Declare default permissions as read only.
permissions: read-all

# Releases run one at a time so runs never publish concurrently.
concurrency:
  group: release-publishing-lock
  cancel-in-progress: false

jobs:
  release:
    name: release
    # Scheduled runs only exist on the default branch of this repository.
    if: github.repository == 'dhc-tech/flutter-packages'
    runs-on: ubuntu-latest
    permissions:
      # Pushes package tags and reads the validate check.
      contents: write
      checks: read
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0 # Full history and tags are needed to tag releases.
          persist-credentials: false

      - name: Look for unpublished package versions
        id: detect
        run: |
          if DRY_RUN=1 .github/scripts/publish_unpublished.sh | grep -q "would publish"; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "Every package version is already on pub.dev; nothing to do."
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Flutter
        if: steps.detect.outputs.pending == 'true'
        uses: $/.github/actions/install_flutter

      - name: Check validate on this commit
        if: steps.detect.outputs.pending == 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            // Branch protection already required `validate` before the merge.
            // If it ran again on this commit it must have passed; if it never
            // ran (the merge came from GITHUB_TOKEN), trust the required PR checks.
            const { owner, repo } = context.repo;
            const { data: head } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            const ref = head.commit.sha;
            for (let i = 0; i < 40; i++) {
              const { data } = await github.rest.checks.listForRef({
                owner, repo, ref, check_name: 'validate',
              });
              const check = data.check_runs.find((c) => c.name === 'validate');
              if (!check) {
                if (i >= 4) {
                  core.info('No validate run on this commit; relying on the required PR checks.');
                  return;
                }
              } else if (check.status === 'completed') {
                if (check.conclusion === 'success') return;
                core.setFailed(`validate finished with conclusion: ${check.conclusion}`);
                return;
              }
              await new Promise((r) => setTimeout(r, 15000));
            }
            core.setFailed('Timed out waiting for the validate check');

      - name: Publish unpublished packages
        if: steps.detect.outputs.pending == 'true'
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_USER_NAME: ${{ secrets.USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.USER_EMAIL }}
        run: |
          gh auth setup-git
          git config --global user.name "$GIT_USER_NAME"
          git config --global user.email "$GIT_USER_EMAIL"
          flutter pub get
          .github/scripts/publish_unpublished.sh
