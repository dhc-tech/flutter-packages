name: release
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base-sha:
        description: >-
          Base SHA/ref to diff against for --all-changed (defaults to HEAD~).
          Use this to publish version bumps that were merged while this
          workflow was broken and never got picked up automatically.
        required: false
        type: string

# Declare default permissions as read only.
permissions: read-all

jobs:
  release:
    name: release
    permissions:
      # Release needs to push a tag back to the repo.
      contents: write
    runs-on: ubuntu-latest
    steps:
    # Checks out a copy of the repo.
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0 # Fetch all history so the tool can get all the tags to determine version.
        persist-credentials: false
    - name: "Install Flutter"
      uses: ./.github/workflows/internals/install_flutter
    - name: Set up tools
      run: dart pub get
      working-directory: ${{ github.workspace }}/script/tool

    # Wait for this SHA's 'validate' check to finish successfully before publishing
    - name: Wait for validate check
      uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
      with:
        ref: ${{ github.sha }}
        check-name: 'validate'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        wait-interval: 15
        allowed-conclusions: success,neutral
        verbose: false

    - name: run release
      run: |
        gh auth setup-git
        git config --global user.name ${{ secrets.USER_NAME }}
        git config --global user.email ${{ secrets.USER_EMAIL }}
        dart ./script/tool/lib/src/main.dart publish --all-changed --base-sha="${BASE_SHA:-HEAD~}" --skip-confirmation --remote=origin
      env:
        BASE_SHA: ${{ inputs.base-sha }}
        PUB_CREDENTIALS: "${{ secrets.PUB_CREDENTIALS }}"
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
