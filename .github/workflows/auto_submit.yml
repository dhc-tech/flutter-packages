# Auto-merges pull requests labeled with 'autosubmit' once CI checks pass and reviews are approved.
# Based on official flutter/packages auto-submit pipeline standard.

name: Auto Submit & Merge

# pull_request_target (not pull_request) so a fork PR can still be merged
# by this job once labeled/approved. Mitigation: MERGE_FORKS is "false"
# below, and this workflow never checks out or executes any PR content —
# automerge-action only calls the merge API.
on: # zizmor: ignore[dangerous-triggers] mitigated as documented above
  pull_request_target:
    types: [labeled, unlabeled, synchronize, opened, edited, ready_for_review, reopened]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  status: {}

concurrency:
  group: auto-submit-${{ github.event.pull_request.number || github.event.check_suite.pull_requests[0].number }}
  cancel-in-progress: false

permissions: {}

jobs:
  auto_submit:
    name: 🤖 Auto Submit PR
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    permissions:
      contents: write        # performing the actual merge
      pull-requests: write   # reading/updating PR state (labels, mergeability)
      issues: write          # posting the "removed autosubmit" explanation comment
      actions: read          # reading this job's own log to extract the real failure reason
    steps:
      # Closes the loop fully: a human never has to manually add the
      # autosubmit label. Approving the PR IS the "please merge this"
      # signal — the label step below just makes that explicit so the
      # automerge-action step (which gates on MERGE_LABELS) picks it up
      # in this same run.
      - name: 🏷️ Add autosubmit label on approval
        if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "autosubmit"

      - name: 🚀 Auto-merge if Approved & CI Green
        id: automerge
        uses: pascalgn/automerge-action@7961b8b5eec56cc088c140b56d864285eabd3f67 # v0.16.4
        env:
          # A push made with the default GITHUB_TOKEN does not trigger
          # further workflow runs (GitHub's anti-recursion rule) — so a
          # merge performed with it would not create downstream
          # push-triggered workflow runs at all. PAT_TOKEN allows matching
          # workflows to run; each workflow's own branch/path filters
          # still apply as normal (e.g. auto_version_and_changelog.yml
          # still only fires on a push to main touching packages/**).
          GITHUB_TOKEN: "${{ secrets.PAT_TOKEN }}"
          MERGE_LABELS: "autosubmit"
          MERGE_METHOD: "squash"
          MERGE_COMMIT_MESSAGE: "pull-request-title-and-description"
          MERGE_FORKS: "false"
          MERGE_RETRIES: "6"
          MERGE_RETRY_SLEEP: "10000"

      # Mirrors flutter/packages' auto-submit bot: if the PR was labeled
      # autosubmit but wasn't actually ready (checks failing, missing
      # approval, etc. — everything MERGE_RETRIES was exhausted trying
      # to resolve above), pull the label back off and say why, instead
      # of leaving it silently sitting there implying "still queued."
      #
      # This workflow has multiple triggers (pull_request_target,
      # check_suite, status) that can fire within seconds of each other
      # for the same underlying event, each running its own full set of
      # retries independently. Without a guard, every one of them posts
      # its own copy of this comment. Checking whether the label is
      # still actually present first makes this idempotent: whichever
      # run gets here first does the work, every other one is a no-op.
      - name: 🏷️ Remove autosubmit label if not ready
        if: steps.automerge.outputs.mergeResult == 'not_ready' || steps.automerge.outputs.mergeResult == 'merge_failed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.automerge.outputs.pullRequestNumber }}
          MERGE_RESULT: ${{ steps.automerge.outputs.mergeResult }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "0" ]; then
            echo "No PR number from automerge-action output; skipping."
            exit 0
          fi
          has_label=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '[.labels[].name] | contains(["autosubmit"])')
          if [ "$has_label" != "true" ]; then
            echo "autosubmit label already removed by a concurrent run; skipping duplicate comment."
            exit 0
          fi

          # Pull the real reason out of this same job's own log instead of
          # a generic template — automerge-action logs the exact GitHub
          # API error (e.g. "Resource not accessible by personal access
          # token", "not mergeable state: dirty", a specific failing
          # check) on every retry. The last occurrence is the one that
          # actually mattered.
          reason=$(gh run view "$RUN_ID" --repo "$REPO" --log 2>/dev/null \
            | grep -i "Failed to merge PR:\|Current PR status:" \
            | tail -1 \
            | sed -E 's/^[^\t]*\t[^\t]*\t[0-9TZ:.-]+ (INFO|ERROR)\s*//')
          if [ -z "$reason" ]; then
            reason="(no specific reason captured from the log — check the workflow run for details)"
          fi

          gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "autosubmit" || true
          body="🤖 Removed the \`autosubmit\` label — merge attempt result: \`$MERGE_RESULT\`"
          body="$body"$'\n\n'"**Reason:** $reason"
          body="$body"$'\n\n'"Fix the actual issue above, then re-apply the \`autosubmit\` label to retry. [Full run log](${GITHUB_SERVER_URL}/${REPO}/actions/runs/${RUN_ID})."
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$body"
