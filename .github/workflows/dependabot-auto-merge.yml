#
# Enables native auto-merge for Dependabot PRs, but only under
# conservative conditions: PR author must genuinely be dependabot[bot]
# (enforced by the job condition, not just the workflow trigger), and the
# update must be a patch or minor semver bump — major bumps always need a
# human look. GitHub's own branch protection (required checks, required
# review) still governs whether the merge actually happens; this only
# flips the auto-merge switch.
#
# Uses dependabot/fetch-metadata, the action maintained by the Dependabot
# team itself for exactly this purpose.

name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for safe updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
