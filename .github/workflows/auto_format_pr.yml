name: 🎨 Auto-Format PR

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  format:
    name: Auto Format Dart Code
    runs-on: ubuntu-latest
    # Only run for PRs from within the same repo (not forks)
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: 📥 Checkout PR Branch
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      # Use the same Flutter action as CI to guarantee identical formatter versions
      - name: 🛠️ Setup Dart & Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: 🎨 Run Dart Format
        # One package at a time, matching ci.yml's check — see that file's
        # comment for why formatting from the repo root in one shot was
        # non-convergent.
        run: |
          for pkg in packages/*; do
            [ -f "$pkg/pubspec.yaml" ] || continue
            (cd "$pkg" && dart format .)
          done

      - name: 🚀 Commit & Push Formatting Fixes (Zero Manual Work)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format Dart files [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
