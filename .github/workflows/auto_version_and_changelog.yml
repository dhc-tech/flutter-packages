name: 🚀 Auto Version, Changelog & Tag Release

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-version-and-changelog-main
  cancel-in-progress: false

jobs:
  version_and_release:
    name: 📦 Semantic Version Bump & Changelog
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release):') && !contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write   # melos version pushes commits + release tags

    steps:
      - name: 📥 Checkout Repository (Full History)
        # zizmor: ignore[artipacked] persist-credentials must stay true —
        # this job needs git push credentials for melos version --push
        # below, not just read access.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Setup Dart & Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: ⚡ Activate Melos
        run: |
          # Pinned to melos 6.x deliberately — melos 8+ requires the
          # directory to be a native Dart pub workspace (root pubspec.yaml
          # with a workspace: field, each member package's own
          # pubspec.yaml opting in via resolution: workspace) to discover
          # any packages at all. Adding resolution: workspace to a
          # *published* package's pubspec.yaml would break `dart pub get`
          # for anyone depending on it outside this monorepo — not
          # acceptable. Melos 6.x discovers packages purely from
          # melos.yaml's glob, no native workspace needed.
          #
          # This was silently broken from the start: every prior run of
          # this workflow hit "not a melos workspace", `melos version`
          # exited non-zero, and the `if` below quietly treated that as
          # "no version changes" — the release pipeline had never
          # actually worked, on any package, ever.
          dart pub global activate melos 6.3.3
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: 📦 Bootstrap workspace
        run: melos bootstrap

      - name: 🔧 Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Version, changelog, tag & push (melos)
        id: melos_version
        run: |
          # Melos analyzes conventional commits since each package's last
          # <name>-vX.Y.Z tag, bumps pubspec.yaml, writes CHANGELOG.md,
          # commits as the bot, creates the release tag, and pushes both
          # the commit and the tag — in one step, same as flutter/packages.
          #
          # Failure handling is intentionally NOT a blanket "any non-zero
          # exit means nothing to release" — that exact blanket swallow
          # is what let this step report false success for months while
          # melos failed outright on every run. Only "nothing left to
          # version" is treated as benign; anything else fails the job
          # loudly so a real breakage can never hide again.
          set +e
          output=$(melos version --all --yes --push 2>&1)
          exit_code=$?
          echo "$output"
          set -e

          if [ $exit_code -eq 0 ]; then
            echo "versioned=true" >> "$GITHUB_OUTPUT"
          elif echo "$output" | grep -qi "nothing to release\|no changes to release\|no packages need"; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            echo "No package changes requiring a version bump."
          else
            echo "melos version failed for a reason other than 'nothing to release' — failing the job."
            exit 1
          fi
