name: 🚀 Auto Version & Changelog PR

# Two-stage release, matching the flutter/packages / release-please
# pattern — required because branch protection blocks any direct push
# to main ("Changes must be made through a pull request"), including
# from this bot. Confirmed the hard way: melos version's commit was
# rejected outright, while the tags it also pushed were NOT rejected
# (tags aren't the protected `main` ref) — leaving 3 tags pointing at
# commits that were never actually on main. Deleted those; this
# workflow no longer creates tags at all.
#
# Stage 1 (this workflow): melos computes the version bump + changelog
# on a new branch, opens a PR, labels it autosubmit. Goes through the
# normal review + CI gate like any other change.
# Stage 2 (release_tag_on_merge.yml): once that PR merges to main,
# create + push the actual release tag(s) — which DOES trigger
# publish.yml, since creating a tag isn't blocked by "require PR for
# main".

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-version-and-changelog-main
  cancel-in-progress: false

jobs:
  version_and_release:
    name: 📦 Semantic Version Bump & Changelog PR
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release):') && !contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write        # pushing the release branch
      pull-requests: write   # opening + labeling the release PR

    steps:
      - name: 📥 Checkout Repository (Full History)
        # GITHUB_TOKEN is fine here — this stage only pushes a new
        # branch and opens a PR, neither of which the anti-recursion
        # push-trigger suppression applies to (that only affects
        # push/tag-triggered workflows, which is why release_tag_on_merge.yml
        # specifically needs PAT_TOKEN and this one doesn't).
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 🛠️ Setup Dart & Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: ⚡ Activate Melos
        run: |
          # melos 8+ requires the directory to be a native Dart pub
          # workspace to discover any packages at all. The root
          # pubspec.yaml declares one (workspace: field), and each
          # package opts in via resolution: workspace — stripped again
          # right before dart pub publish in publish.yml so the field
          # never reaches pub.dev / external consumers of the packages.
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: 📦 Bootstrap workspace
        run: melos bootstrap

      - name: 🔧 Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🌿 Create release branch
        id: branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          branch="release/auto-${RUN_ID}"
          git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: 🚀 Version & changelog (melos, no tag)
        id: melos_version
        run: |
          # --no-git-tag-version: tags come later, only once this PR's
          # commit is actually on main (see release_tag_on_merge.yml).
          # melos 8 also has no --push flag at all any more; this branch
          # gets pushed explicitly below, separately from main.
          #
          # Failure handling is intentionally NOT a blanket "any
          # non-zero exit means nothing to release" — that exact
          # swallow is what let this step report false success for
          # months while melos failed outright on every run.
          set +e
          output=$(melos version --all --yes --no-git-tag-version 2>&1)
          exit_code=$?
          echo "$output"
          set -e

          if [ $exit_code -eq 0 ]; then
            echo "versioned=true" >> "$GITHUB_OUTPUT"
          elif echo "$output" | grep -qi "nothing to release\|no changes to release\|no packages need"; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            echo "No package changes requiring a version bump."
          else
            echo "melos version failed for a reason other than 'nothing to release' — failing the job."
            exit 1
          fi

      - name: 🚀 Push release branch
        if: steps.melos_version.outputs.versioned == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: git push origin "$BRANCH"

      - name: 📬 Open release PR
        if: steps.melos_version.outputs.versioned == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          pr_url=$(gh pr create \
            --title "chore(release): version packages" \
            --body "Automated version bump + changelog from melos. Merging this PR triggers the release tag(s), which then trigger pub.dev publishing." \
            --base main \
            --head "$BRANCH" \
            --label "autosubmit")
          echo "Opened $pr_url"
