name: 🚀 Auto Version, Changelog & Tag Release

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
  workflow_dispatch:

permissions: {}

concurrency:
  group: auto-version-and-changelog-main
  cancel-in-progress: false

jobs:
  version_and_release:
    name: 📦 Semantic Version Bump & Changelog
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'chore(release):') && !contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write   # melos version pushes commits + release tags

    steps:
      - name: 📥 Checkout Repository (Full History)
        # zizmor: ignore[artipacked] persist-credentials must stay true —
        # this job needs git push credentials for melos version --push
        # below, not just read access.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Setup Dart & Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: ⚡ Activate Melos
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: 🔧 Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🚀 Version, changelog, tag & push (melos)
        id: melos_version
        run: |
          # Melos analyzes conventional commits since each package's last
          # <name>-vX.Y.Z tag, bumps pubspec.yaml, writes CHANGELOG.md,
          # commits as the bot, creates the release tag, and pushes both
          # the commit and the tag — in one step, same as flutter/packages.
          if melos version --all --yes --push; then
            echo "versioned=true" >> $GITHUB_OUTPUT
          else
            echo "versioned=false" >> $GITHUB_OUTPUT
            echo "No package changes requiring a version bump."
          fi
