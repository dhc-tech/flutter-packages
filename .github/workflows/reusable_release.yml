name: Reusable Release
on:
  workflow_call:
    inputs:
      is-batch-release:
        required: true
        type: boolean
      branch-name:
        required: true
        type: string
    secrets:
      USER_NAME:
        required: true
      USER_EMAIL:
        required: true
      PUB_CREDENTIALS:
        required: true
jobs:
  release:
    name: release
    permissions:
      # Release needs to push a tag back to the repo.
      contents: write
    runs-on: ubuntu-latest
    steps:
    # Checks out a copy of the repo.
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0 # Fetch all history so the tool can get all the tags to determine version.
        ref: ${{ inputs.branch-name }}
        persist-credentials: false
    - name: "Install Flutter"
      uses: ./.github/workflows/internals/install_flutter
    - name: Set up tools
      run: dart pub get
      working-directory: ${{ github.workspace }}/script/tool

    # Wait for this SHA's other checks to finish before publishing, using the
    # official actions/github-script action to poll the Checks API directly.
    # Replaces lewagon/wait-on-check-action, a Ruby-based action (installs a
    # full Ruby + bundler + gems toolchain just to poll a REST endpoint) that
    # also waited on 'Linux ci_yaml packages roller', a check name that only
    # exists in flutter/packages' own Cocoon/LUCI infrastructure and never
    # runs on this fork.
    - name: Wait for other checks to complete
      if: inputs.branch-name == 'main'
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v8.0.0
      with:
        script: |
          const sha = context.sha;
          const timeoutMs = 20 * 60 * 1000;
          const pollMs = 30 * 1000;
          const start = Date.now();
          while (Date.now() - start < timeoutMs) {
            const { data } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: sha,
            });
            const others = data.check_runs.filter((c) => c.name !== 'release');
            if (others.length === 0) {
              core.info('No other checks registered yet; waiting.');
            } else if (others.every((c) => c.status === 'completed')) {
              const failed = others.filter(
                (c) => !['success', 'neutral', 'skipped'].includes(c.conclusion),
              );
              if (failed.length > 0) {
                core.setFailed(
                  `Check(s) failed: ${failed.map((c) => c.name).join(', ')}`,
                );
              }
              return;
            }
            await new Promise((resolve) => setTimeout(resolve, pollMs));
          }
          core.setFailed('Timed out waiting for other checks to complete.');

    - name: run release
      run: |
        gh auth setup-git
        git config --global user.name "${{ secrets.USER_NAME }}"
        git config --global user.email "${{ secrets.USER_EMAIL }}"
        
        # Build the flag string based on the input
        BATCH_FLAG=""
        if [ "${{ inputs.is-batch-release }}" = "true" ]; then
          BATCH_FLAG="--batch-release-branch=${INPUTS_BRANCH_NAME}"
        fi
        
        dart ./script/tool/lib/src/main.dart publish \
          --all-changed \
          $BATCH_FLAG \
          --base-sha=HEAD~ \
          --skip-confirmation \
          --remote=origin
      env:
        PUB_CREDENTIALS: "${{ secrets.PUB_CREDENTIALS }}"
        INPUTS_BRANCH_NAME: "${{ inputs.branch-name }}"
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
