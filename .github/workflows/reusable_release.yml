name: Reusable Release
on:
  workflow_call:
    inputs:
      is-batch-release:
        required: true
        type: boolean
      branch-name:
        required: true
        type: string
    secrets:
      USER_NAME:
        required: true
      USER_EMAIL:
        required: true
      PUB_CREDENTIALS:
        required: true
jobs:
  release:
    name: release
    permissions:
      # Release needs to push a tag back to the repo.
      contents: write
    runs-on: ubuntu-latest
    steps:
    # Checks out a copy of the repo.
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0 # Fetch all history so the tool can get all the tags to determine version.
        ref: ${{ inputs.branch-name }}
        persist-credentials: false
    - name: "Install Flutter"
      uses: ./.github/workflows/internals/install_flutter
    - name: Set up tools
      run: dart pub get
      working-directory: ${{ github.workspace }}/script/tool

    # Wait for this SHA's 'validate' check to register, then for every check
    # on the SHA to finish, using the Marketplace lewagon/wait-on-check-action
    # (actively maintained). Previously this pointed at 'Linux ci_yaml
    # packages roller', a check name that only exists in flutter/packages'
    # own Cocoon/LUCI infrastructure and never runs on this fork — pointed at
    # this repo's own 'validate' check instead.
    - name: Wait for test check-in
      if: inputs.branch-name == 'main'
      uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
      with:
        ref: ${{ github.sha }}
        check-name: 'validate'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        wait-interval: 30
        allowed-conclusions: success,neutral
        verbose: false

    - name: Wait on all tests
      if: inputs.branch-name == 'main'
      uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
      with:
        ref: ${{ github.sha }}
        running-workflow-name: 'release'
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        wait-interval: 60
        allowed-conclusions: success,neutral
        verbose: false

    - name: run release
      run: |
        gh auth setup-git
        git config --global user.name "${{ secrets.USER_NAME }}"
        git config --global user.email "${{ secrets.USER_EMAIL }}"
        
        # Build the flag string based on the input
        BATCH_FLAG=""
        if [ "${{ inputs.is-batch-release }}" = "true" ]; then
          BATCH_FLAG="--batch-release-branch=${INPUTS_BRANCH_NAME}"
        fi
        
        dart ./script/tool/lib/src/main.dart publish \
          --all-changed \
          $BATCH_FLAG \
          --base-sha=HEAD~ \
          --skip-confirmation \
          --remote=origin
      env:
        PUB_CREDENTIALS: "${{ secrets.PUB_CREDENTIALS }}"
        INPUTS_BRANCH_NAME: "${{ inputs.branch-name }}"
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
