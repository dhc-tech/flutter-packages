# Explicit, manually-triggered batch release — the flutter/packages
# "release selected/affected packages together" capability, adapted to
# this repo's actual size (3 packages) rather than copying their
# internal batch-release infrastructure wholesale.
#
# "Batch release" here means: release a chosen set of packages
# together as one coordinated PR, each keeping its own independent
# version — NOT "give every package the same version number". Reuses
# the exact same melos-driven, PR-based release mechanism as the
# automatic per-merge release (auto_version_and_changelog.yml); this
# workflow only changes WHICH packages melos considers and WHEN it
# runs, not HOW versioning/changelog/tagging work.

name: 📦 Batch Release

on:
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Comma-separated package names to release (e.g.
          "dig_cli,white_label_kit"), or "all" to evaluate every
          publishable package. Packages with no release-worthy commits
          since their last tag are skipped automatically either way —
          this selects the candidate set, it doesn't force a version
          bump on a package that hasn't actually changed.
        required: true
        type: string
        default: "all"

permissions: {}

concurrency:
  group: auto-version-and-changelog-main
  cancel-in-progress: false

jobs:
  batch_release:
    name: 📦 Batch Version Bump & Changelog PR
    runs-on: ubuntu-latest
    permissions:
      contents: write        # pushing the release branch
      pull-requests: write   # opening + labeling the release PR

    steps:
      - name: 📥 Checkout Repository (Full History)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: 🛠️ Setup Dart & Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: ⚡ Activate Melos
        run: |
          dart pub global activate melos
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: 📦 Bootstrap workspace
        run: melos bootstrap

      - name: 🔧 Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: ✅ Validate requested package names
        id: scope
        env:
          PACKAGES_INPUT: ${{ inputs.packages }}
        run: |
          if [ "$PACKAGES_INPUT" = "all" ]; then
            echo "melos_args=--all" >> "$GITHUB_OUTPUT"
            echo "Releasing: every publishable package."
            exit 0
          fi

          scope_args=""
          IFS=',' read -ra names <<< "$PACKAGES_INPUT"
          for name in "${names[@]}"; do
            name="$(echo "$name" | xargs)"  # trim whitespace
            if [ ! -f "packages/$name/pubspec.yaml" ]; then
              echo "❌ 'packages/$name' isn't a real package directory. Stopping." && exit 1
            fi
            scope_args="$scope_args --scope=$name"
          done
          echo "melos_args=$scope_args" >> "$GITHUB_OUTPUT"
          echo "Releasing: $PACKAGES_INPUT"

      - name: 🌿 Create release branch
        id: branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          branch="release/batch-${RUN_ID}"
          git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: 🚀 Version & changelog (melos, no tag)
        id: melos_version
        env:
          MELOS_ARGS: ${{ steps.scope.outputs.melos_args }}
        run: |
          set +e
          output=$(melos version $MELOS_ARGS --yes --no-git-tag-version 2>&1)
          exit_code=$?
          echo "$output"
          set -e

          if [ $exit_code -eq 0 ]; then
            echo "versioned=true" >> "$GITHUB_OUTPUT"
          elif echo "$output" | grep -qi "nothing to release\|no changes to release\|no packages need"; then
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            echo "No selected package has release-worthy changes since its last tag."
          else
            echo "melos version failed for a reason other than 'nothing to release' — failing the job."
            exit 1
          fi

      - name: 🚀 Push release branch
        if: steps.melos_version.outputs.versioned == 'true'
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: git push origin "$BRANCH"

      - name: 📬 Open batch release PR
        if: steps.melos_version.outputs.versioned == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
          PACKAGES_INPUT: ${{ inputs.packages }}
        run: |
          pr_url=$(gh pr create \
            --title "chore(release): batch version packages ($PACKAGES_INPUT)" \
            --body "Manually-triggered batch release. Each package below keeps its own independent version — merging this PR triggers a release tag per package, which then triggers pub.dev publishing for that package only." \
            --base main \
            --head "$BRANCH" \
            --label "autosubmit")
          echo "Opened $pr_url"
