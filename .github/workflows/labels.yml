name: Sync Labels

# .github/labels.json is the source of truth for the repository's labels
# (names, colors, descriptions). See docs/labels.md.

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/scripts/sync_labels.sh
  workflow_dispatch:

# Declare default permissions as read only.
permissions: read-all

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/sync_labels.sh
