name: release-pr

# Computes the next package versions and changelogs from Conventional Commits
# with Melos and keeps a single `release/next` pull request up to date.
# Merging that PR bumps the versions on `main`, which triggers `release.yml`
# to publish and tag the changed packages.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      prerelease:
        description: Version as a `-dev.N` prerelease instead of a stable release.
        required: false
        type: boolean
        default: false

# Declare default permissions as read only.
permissions: read-all

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  release-pr:
    name: release-pr
    # Merging the release PR itself must not open another one.
    if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Melos needs the full history and tags.
          persist-credentials: false

      - name: Install Flutter
        uses: $/.github/workflows/internals/install_flutter

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Version packages
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--yes --no-git-tag-version --no-git-commit-version)
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease --preid dev)
          fi
          dart run melos version "${args[@]}"

      - name: Open or update the release PR
        env:
          # A PAT lets validate run on the release PR; PRs opened with the
          # default GITHUB_TOKEN do not trigger other workflows.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          GIT_USER_NAME: ${{ secrets.USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.USER_EMAIL }}
        run: |
          if [ -z "$(git status --porcelain -- packages)" ]; then
            echo "No releasable changes."
            exit 0
          fi
          gh auth setup-git
          git config user.name "$GIT_USER_NAME"
          git config user.email "$GIT_USER_EMAIL"
          git checkout -B release/next
          git add packages
          git commit -m "chore(release): publish packages"
          git push --force origin release/next
          if [ -z "$(gh pr list --head release/next --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head release/next \
              --title "chore(release): publish packages" \
              --body "Automated release PR generated by \`melos version\` from Conventional Commits. Merging publishes the bumped packages to pub.dev and tags them. Review the version bumps and changelogs first."
          fi
