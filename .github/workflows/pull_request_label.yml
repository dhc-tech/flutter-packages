# This workflow applies labels to pull requests based on the
# paths that are modified in the pull request.
#
# Edit `.github/labeler.yml` and `.github/post_merge_labeler.yml`
# to configure labels.
#
# For more information, see: https://github.com/actions/labeler

name: Pull Request Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

# Declare default permissions as read only.
permissions: read-all

jobs:
  label:
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true

      - name: Auto-trigger Sourcery review on PR update
        if: github.event.action == 'synchronize'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v8.0.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: '@sourcery-ai review',
            });

