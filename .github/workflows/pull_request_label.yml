# Applies labels to pull requests based on modified paths.
# Based on official flutter/packages pull_request_label.yml standard.

name: Pull Request Labeler

# pull_request_target so labels apply even on a fork PR. Mitigation:
# actions/labeler only reads the diff's changed file paths against our
# own static .github/labeler.yml — it never checks out or executes PR
# content.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  label:
    name: 🏷️ Label PR by Package
    runs-on: ubuntu-latest
    permissions:
      contents: read        # reading changed-file paths to match against labeler.yml
      pull-requests: write  # applying/removing labels
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          sync-labels: true
