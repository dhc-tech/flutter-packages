# Release Bot — mirrors flutter/packages' automated release flow.
#
# On every push to main, melos inspects conventional commits (`fix:`,
# `feat:`, `feat!:`, ...) since each package's last `<name>-vX.Y.Z` tag,
# decides the version bump, writes the CHANGELOG.md entry, commits as
# a bot, and pushes the release tag itself — all in one step
# (`melos version --all --yes --push`).
#
# That pushed tag is what publish.yml already listens for, so merging
# a conventional-commit PR to main is the only human action required;
# everything else (version, changelog, tag, publish) is automatic.
#
# The bot's own commit message carries "[skip ci]" so this workflow
# (and CI) doesn't re-trigger itself in a loop.

name: 🤖 Release Bot (melos version + tag)

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-bot-main
  cancel-in-progress: false

jobs:
  version:
    name: 🏷️ Version, changelog & tag bumped packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: 📥 Checkout Monorepo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 🛠️ Setup Dart & Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🤖 Configure bot identity
        run: |
          git config user.name "dhc-tech"
          git config user.email "150371713+dhc-tech@users.noreply.github.com"

      - name: ⚡ Activate melos
        run: dart pub global activate melos

      - name: 📦 Bootstrap workspace
        run: melos bootstrap

      - name: 🏷️ Version, changelog & push release tags
        run: melos version --all --yes --push
