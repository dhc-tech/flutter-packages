name: CI Matrix Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Code Formatting & Linting (Linux + macOS)
  # ============================================================================
  analyze:
    name: 🔍 Formatting & Static Analysis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Monorepo
        uses: actions/checkout@v4.2.2

      - name: 🛠️ Setup Dart & Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Resolve Package Dependencies
        shell: bash
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/pubspec.yaml" ]; then
              echo "➜ Resolving dependencies for $pkg..."
              if grep -q "sdk: flutter" "$pkg/pubspec.yaml"; then
                (cd "$pkg" && flutter pub get)
              else
                (cd "$pkg" && dart pub get)
              fi
            fi
          done

      - name: 🎨 Verify Dart Code Formatting
        shell: bash
        run: dart format --output=none --set-exit-if-changed packages/

      - name: 🔍 Static Analysis (Fatal Infos Enforcement)
        shell: bash
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/pubspec.yaml" ]; then
              echo "➜ Analyzing $pkg..."
              if grep -q "sdk: flutter" "$pkg/pubspec.yaml"; then
                (cd "$pkg" && flutter analyze --fatal-infos)
              else
                (cd "$pkg" && dart analyze --fatal-infos)
              fi
            fi
          done

  # ============================================================================
  # 2. Automated Test Matrix — Linux, macOS, Windows
  # ============================================================================
  test:
    name: 🧪 Automated Test Suite Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 25
    needs: analyze

    steps:
      - name: 📥 Checkout Monorepo
        uses: actions/checkout@v4.2.2

      - name: 🛠️ Setup Dart & Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── Linux / macOS ──────────────────────────────────────────────────────
      - name: 📦 Resolve Package Dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/pubspec.yaml" ]; then
              if grep -q "sdk: flutter" "$pkg/pubspec.yaml"; then
                (cd "$pkg" && flutter pub get)
              else
                (cd "$pkg" && dart pub get)
              fi
            fi
          done

      - name: 🧪 Execute Tests per Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg/test" ]; then
              echo "➜ Running tests for $pkg..."
              if grep -q "sdk: flutter" "$pkg/pubspec.yaml"; then
                (cd "$pkg" && flutter test)
              else
                (cd "$pkg" && dart test)
              fi
            fi
          done

      # ── Windows ─────────────────────────────────────────────────────────────
      - name: 📦 Resolve Package Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path packages -Directory | ForEach-Object {
            $pkg = $_.FullName
            if (Test-Path "$pkg\pubspec.yaml") {
              Write-Host "➜ Resolving dependencies for $pkg..."
              $content = Get-Content "$pkg\pubspec.yaml" -Raw
              Push-Location $pkg
              if ($content -match "sdk: flutter") {
                flutter pub get
              } else {
                dart pub get
              }
              Pop-Location
            }
          }

      - name: 🧪 Execute Tests per Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path packages -Directory | ForEach-Object {
            $pkg = $_.FullName
            $testDir = "$pkg\test"
            if (Test-Path $testDir) {
              Write-Host "➜ Running tests for $pkg..."
              $content = Get-Content "$pkg\pubspec.yaml" -Raw
              Push-Location $pkg
              if ($content -match "sdk: flutter") {
                flutter test
              } else {
                dart test
              }
              Pop-Location
            }
          }

  # ============================================================================
  # 3. Pub.dev Pana Package Quality Gate (Linux only)
  # ============================================================================
  pana:
    name: 🏆 Pub.dev Package Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: analyze

    steps:
      - name: 📥 Checkout Monorepo
        uses: actions/checkout@v4.2.2

      - name: 🛠️ Setup Dart & Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ⚡ Activate Pana
        run: dart pub global activate pana

      - name: 🔍 Run Pana Score Validation across all packages
        shell: bash
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/pubspec.yaml" ]; then
              echo "🏆 Validating Pub.dev quality score for $pkg..."
              $HOME/.pub-cache/bin/pana --no-warning --exit-code-threshold 30 "$pkg"
            fi
          done
