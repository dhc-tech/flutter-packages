name: CI Matrix Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ============================================================================
  # 1. Code Formatting & Linting (Linux + macOS)
  # ============================================================================
  analyze:
    name: 🔍 Formatting & Static Analysis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Monorepo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: 🛠️ Setup Dart & Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: 📦 Resolve Package Dependencies
        shell: bash
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/pubspec.yaml" ]; then
              echo "➜ Resolving dependencies for $pkg..."
              if grep -q "sdk: flutter" "$pkg/pubspec.yaml"; then
                (cd "$pkg" && flutter pub get)
              else
                (cd "$pkg" && dart pub get)
              fi
            fi
          done

      - name: 🎨 Verify Dart Code Formatting
        shell: bash
        # Formatted one package at a time, not one shot from the repo root:
        # with no root workspace pubspec, `dart format packages/` in one
        # call resolves each file's language version ambiguously across
        # independently-versioned packages, which made this check
        # non-convergent (flip-flopping between two valid formatter outputs
        # across runs). Scoping each invocation to one package's own
        # resolved context is stable.
        run: |
          for pkg in packages/*; do
            [ -f "$pkg/pubspec.yaml" ] || continue
            (cd "$pkg" && dart format --output=none --set-exit-if-changed .)
          done

      - name: 🔍 Static Analysis (Fatal Infos Enforcement)
        shell: bash
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/pubspec.yaml" ]; then
              echo "➜ Analyzing $pkg..."
              if grep -q "sdk: flutter" "$pkg/pubspec.yaml"; then
                (cd "$pkg" && flutter analyze --fatal-infos)
              else
                (cd "$pkg" && dart analyze --fatal-infos)
              fi
            fi
          done

  # ============================================================================
  # 2. Automated Test Matrix — Linux, macOS, Windows
  # ============================================================================
  test:
    name: 🧪 Automated Test Suite Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 25
    needs: analyze

    steps:
      - name: 📥 Checkout Monorepo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: 🛠️ Setup Dart & Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          cache: true

      # ── Linux / macOS ──────────────────────────────────────────────────────
      - name: 📦 Resolve Package Dependencies (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/pubspec.yaml" ]; then
              if grep -q "sdk: flutter" "$pkg/pubspec.yaml"; then
                (cd "$pkg" && flutter pub get)
              else
                (cd "$pkg" && dart pub get)
              fi
            fi
          done

      - name: 🧪 Execute Tests per Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg/test" ]; then
              echo "➜ Running tests for $pkg..."
              if grep -q "sdk: flutter" "$pkg/pubspec.yaml"; then
                (cd "$pkg" && flutter test)
              else
                (cd "$pkg" && dart test)
              fi
            fi
          done

      # ── Windows ─────────────────────────────────────────────────────────────
      - name: 📦 Resolve Package Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path packages -Directory | ForEach-Object {
            $pkg = $_.FullName
            if (Test-Path "$pkg\pubspec.yaml") {
              Write-Host "➜ Resolving dependencies for $pkg..."
              $content = Get-Content "$pkg\pubspec.yaml" -Raw
              Push-Location $pkg
              if ($content -match "sdk: flutter") {
                flutter pub get
              } else {
                dart pub get
              }
              Pop-Location
            }
          }

      - name: 🧪 Execute Tests per Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path packages -Directory | ForEach-Object {
            $pkg = $_.FullName
            $testDir = "$pkg\test"
            if (Test-Path $testDir) {
              Write-Host "➜ Running tests for $pkg..."
              $content = Get-Content "$pkg\pubspec.yaml" -Raw
              Push-Location $pkg
              if ($content -match "sdk: flutter") {
                # Use --reporter github to avoid interactive batch prompts on Windows
                & flutter test --reporter github --no-pub
                if ($LASTEXITCODE -ne 0) { throw "Tests failed for $pkg" }
              } else {
                & dart test --reporter github
                if ($LASTEXITCODE -ne 0) { throw "Tests failed for $pkg" }
              }
              Pop-Location
            }
          }

  # ============================================================================
  # 3. Pub.dev Pana Package Quality Gate (Linux only)
  # ============================================================================
  pana:
    name: 🏆 Pub.dev Package Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    needs: analyze

    steps:
      - name: 📥 Checkout Monorepo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: 🛠️ Setup Dart & Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.0'
          cache: true

      - name: ⚡ Activate Pana
        run: dart pub global activate pana

      - name: 🔍 Run Pana Score Validation across all packages
        shell: bash
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/pubspec.yaml" ]; then
              echo "🏆 Validating Pub.dev quality score for $pkg..."
              $HOME/.pub-cache/bin/pana --no-warning --exit-code-threshold 30 "$pkg"
            fi
          done
