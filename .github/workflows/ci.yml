name: CI Matrix Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. Code Formatting & Linting across Multi-OS Matrix
  # ============================================================================
  analyze:
    name: 🔍 Formatting & Static Analysis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: 📥 Checkout Monorepo
        uses: actions/checkout@v4

      - name: 🛠️ Setup Dart & Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Resolve Package Dependencies
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/pubspec.yaml" ]; then
              echo "➜ Resolving dependencies for $pkg..."
              if grep -q "sdk: flutter" "$pkg/pubspec.yaml"; then
                (cd "$pkg" && flutter pub get)
              else
                (cd "$pkg" && dart pub get)
              fi
            fi
          done

      - name: 🎨 Verify Dart Code Formatting
        run: dart format --output=none --set-exit-if-changed packages/

      - name: 🔍 Static Analysis (Fatal Infos Enforcement)
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/pubspec.yaml" ]; then
              echo "➜ Analyzing $pkg..."
              if grep -q "sdk: flutter" "$pkg/pubspec.yaml"; then
                (cd "$pkg" && flutter analyze --fatal-infos)
              else
                (cd "$pkg" && dart analyze --fatal-infos)
              fi
            fi
          done

  # ============================================================================
  # 2. Automated Test Matrix across Multi-OS Matrix (Linux, macOS, Windows)
  # ============================================================================
  test:
    name: 🧪 Automated Test Suite Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    needs: analyze
    defaults:
      run:
        shell: bash

    steps:
      - name: 📥 Checkout Monorepo
        uses: actions/checkout@v4

      - name: 🛠️ Setup Dart & Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Resolve Package Dependencies
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/pubspec.yaml" ]; then
              if grep -q "sdk: flutter" "$pkg/pubspec.yaml"; then
                (cd "$pkg" && flutter pub get)
              else
                (cd "$pkg" && dart pub get)
              fi
            fi
          done

      - name: 🧪 Execute Tests per Package
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg/test" ]; then
              echo "➜ Running test suite for $pkg..."
              if grep -q "sdk: flutter" "$pkg/pubspec.yaml"; then
                (cd "$pkg" && flutter test)
              else
                (cd "$pkg" && dart test)
              fi
            fi
          done

  # ============================================================================
  # 3. Pub.dev Pana Health Score & Package Quality Gate
  # ============================================================================
  pana:
    name: 🏆 Pub.dev Package Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: analyze
    defaults:
      run:
        shell: bash

    steps:
      - name: 📥 Checkout Monorepo
        uses: actions/checkout@v4

      - name: 🛠️ Setup Dart & Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: ⚡ Activate Pana
        run: dart pub global activate pana

      - name: 🔍 Run Pana Score Validation across all packages
        run: |
          for pkg in packages/*; do
            if [ -d "$pkg" ] && [ -f "$pkg/pubspec.yaml" ]; then
              echo "🏆 Validating Pub.dev quality score for $pkg..."
              $HOME/.pub-cache/bin/pana --no-warning --exit-code-threshold 30 "$pkg"
            fi
          done
