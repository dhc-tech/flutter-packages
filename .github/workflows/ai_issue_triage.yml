name: 🤖 AI Issue Triager (Gemini)

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    name: 🧠 Gemini Issue Triage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: GEMINI_API_KEY
    if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: 🔑 Check API Key Availability
        id: check_key
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "⚠️ GEMINI_API_KEY secret not configured. Skipping AI issue triage."
          fi

      - name: 🚀 Run Gemini Issue Triager
        if: steps.check_key.outputs.available == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO: ${{ github.repository }}
        run: |
          python3 .github/scripts/ai_issue_triager.py
