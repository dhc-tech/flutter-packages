# See Dependabot documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      all-github-actions:
        patterns: [ "*" ]
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "infra: dependencies"
      - "infra: workflows"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  # Dart & Flutter pub dependencies. The repository is a pub workspace, so a
  # single entry at the root resolves every package together.
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pub-dependencies:
        patterns: [ "*" ]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "infra: dependencies"
