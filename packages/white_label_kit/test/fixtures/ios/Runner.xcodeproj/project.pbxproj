			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# Uploads dSYMs for this build's tenant to Firebase Crashlytics.\n# GoogleService-Info.plist is tenant-specific and is synced into place by\n# scripts/build_tenant.sh before every build, so this script needs no\n# per-tenant/per-flavor changes.\n#\n# Firebase is resolved via Swift Package Manager (Flutter's SPM plugin\n# integration), not CocoaPods, so there is no Pods/ dir and no\n# `pod install`-provided upload-symbols binary. The tool instead lives\n# inside the checked-out firebase-ios-sdk SPM package under BUILD_DIR.\n\nif [ \"${CONFIGURATION}\" == \"Debug\" ]; then\n  echo \"Crashlytics: skipping dSYM upload for Debug configuration\"\n  exit 0\nfi\n\nSPM_CHECKOUTS=\"${BUILD_DIR%Build/*}SourcePackages/checkouts\"\nUPLOAD_SYMBOLS=$(find \"${SPM_CHECKOUTS}/firebase-ios-sdk\" -type f -name upload-symbols -perm -u+x 2>/dev/null | head -n 1)\nGSP_PATH=\"${SRCROOT}/Runner/GoogleService-Info.plist\"\n\nif [ -z \"${UPLOAD_SYMBOLS}\" ] || [ ! -f \"${UPLOAD_SYMBOLS}\" ]; then\n  echo \"warning: FirebaseCrashlytics upload-symbols not found under ${SPM_CHECKOUTS}/firebase-ios-sdk. Build once (or resolve Swift packages in Xcode) so the firebase-ios-sdk SPM checkout is fetched, then rebuild.\"\n  exit 0\nfi\n\nif [ ! -f \"${GSP_PATH}\" ]; then\n  echo \"warning: ${GSP_PATH} not found. Run scripts/build_tenant.sh <tenant> before building so the tenant's Firebase config is in place.\"\n  exit 0\nfi\n\nif [ -z \"${DWARF_DSYM_FOLDER_PATH}\" ] || [ ! -d \"${DWARF_DSYM_FOLDER_PATH}\" ]; then\n  echo \"warning: no dSYM folder found at DWARF_DSYM_FOLDER_PATH; skipping Crashlytics symbol upload.\"\n  exit 0\nfi\n\n\"${UPLOAD_SYMBOLS}\" -gsp \"${GSP_PATH}\" -p ios \"${DWARF_DSYM_FOLDER_PATH}\"\n";
			showEnvVarsInLog = 0;
		};
