name: white_label_kit
description: >-
  A complete multi-tenant white-label and flavor management toolkit for Flutter
  apps. Automatically configures Android Gradle and iOS Xcode schemes from a single YAML file.
repository: https://github.com/dhc-tech/flutter-packages/tree/main/packages/white_label_kit
issue_tracker: https://github.com/dhc-tech/flutter-packages/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A+white_label_kit%22
version: 0.0.4

environment:
  sdk: ^3.13.0

executables:
  white_label: white_label
  menu: menu
  runner: runner
  init: init
  configure: configure
  generate: generate
  list: list
  add-tenant: add_tenant
  update-tenant: update_tenant
  remove-tenant: remove_tenant
  doctor: doctor
  validate: validate
  run: run
  build: build

dependencies:
  build: ^4.0.10
  path: ^1.9.1
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ^2.16.0
  build_test: ^3.5.19
  lints: ^6.1.0
  test: ^1.25.0

topics:
  - white-label
  - flavors
  - multi-tenant
  - cli
  - build-tools
