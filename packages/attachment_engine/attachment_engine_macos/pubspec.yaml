name: attachment_engine_macos
description: "The macOS implementation of attachment_engine. Full-parity native Swift implementation — PDF (PDFKit), audio/video (AVFoundation/AVKit), webview (WKWebView), share, open-externally, office preview (QuickLook), paths, and download — zero third-party plugin dependencies. Request/response calls go through Pigeon-generated HostApi protocols; audio/video/download event streams stay on hand-written EventChannels."
version: 0.0.1-dev.0
repository: "https://github.com/dhc-tech/flutter-packages/tree/main/packages/attachment_engine/attachment_engine_macos"
issue_tracker: "https://github.com/dhc-tech/flutter-packages/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A+attachment_engine_macos%22"

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  attachment_engine_platform_interface: ^0.0.1-dev.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - attachment
  - macos

flutter:
  plugin:
    implements: attachment_engine
    platforms:
      macos:
        pluginClass: AttachmentEnginePlugin
        dartPluginClass: AttachmentEngineMacos
