analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options

linter:
  rules:
    # Disabled deliberately: this codebase consistently gives public
    # constructor parameters clean names (e.g. `resolver`) while backing
    # them with underscore-prefixed private fields (e.g. `_resolver`) for
    # readability. `prefer_initializing_formals` would require the
    # parameter itself to be named `_resolver`, which leaks private-style
    # naming into the public API surface - a worse tradeoff than a plain
    # assignment in the initializer list.
    prefer_initializing_formals: false
