name: attachment_engine_platform_interface
description: "A common platform interface for the attachment_engine plugin. Defines the pure-Dart, transport-agnostic contract that attachment_engine_android, attachment_engine_ios, and any future platform implementation (e.g. web) must satisfy."
version: 0.0.1-dev.0
repository: "https://github.com/dhc-tech/flutter-packages/tree/main/packages/attachment_engine/attachment_engine_platform_interface"
issue_tracker: "https://github.com/dhc-tech/flutter-packages/issues?q=is%3Aissue+is%3Aopen+label%3A%22p%3A+attachment_engine_platform_interface%22"

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^28.0.0

topics:
  - attachment
  - platform-interface
