name: attachment_engine
description: "Universal attachment engine for Flutter to resolve, cache, download, preview, and render documents, media, and web content using native platform APIs."
version: 0.0.1-dev.1
homepage: "https://github.com/dhc-tech/flutter-packages/tree/main/packages/attachment_engine/attachment_engine"
repository: "https://github.com/dhc-tech/flutter-packages"
issue_tracker: "https://github.com/dhc-tech/flutter-packages/issues"
topics:
  - attachment
  - file-viewer
  - pdf
  - media
  - downloader

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  attachment_engine_platform_interface: ^0.0.1-dev.0
  attachment_engine_android: ^0.0.1-dev.0
  attachment_engine_ios: ^0.0.1-dev.0
  attachment_engine_windows: ^0.0.1-dev.0
  attachment_engine_linux: ^0.0.1-dev.0
  attachment_engine_macos: ^0.0.1-dev.0
  attachment_engine_web: ^0.0.1-dev.0
  crypto: ^3.0.6
  meta: ^1.16.0
  webview_flutter: ^4.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.8
  webview_flutter_platform_interface: ^2.10.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This is a federated plugin: this package is the app-facing API surface
  # (models, cache, download orchestration, capability detection, widgets)
  # and holds no platform-specific transport code itself. It endorses
  # attachment_engine_android/attachment_engine_ios as the default
  # implementations for their respective platforms, so a consumer only ever
  # depends on `attachment_engine` and gets the right native backend
  # automatically.
  plugin:
    platforms:
      android:
        default_package: attachment_engine_android
      ios:
        default_package: attachment_engine_ios
      windows:
        default_package: attachment_engine_windows
      linux:
        default_package: attachment_engine_linux
      macos:
        default_package: attachment_engine_macos
      web:
        default_package: attachment_engine_web

  # Bundled, unmodified third-party JS libraries backing the fully-offline
  # DOCX renderer (OfflineDocxViewer) — see assets/office_offline/README.md
  # for licenses/provenance. No CDN, no network: these ship in the app.
  assets:
    - assets/office_offline/docx_viewer.html
    - assets/office_offline/docx-preview.min.js
    - assets/office_offline/jszip.min.js
    - assets/office_offline/xlsx_viewer.html
    - assets/office_offline/xlsx.full.min.js
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
